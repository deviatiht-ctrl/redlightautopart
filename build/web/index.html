<!DOCTYPE html>
<html lang="ht">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Redlight Autoparts — e-commerce pyès machin ak pyès detache pou mache Ayisyen.">

  <!-- Open Graph / Meta pou pataje -->
  <meta property="og:title" content="Redlight Autoparts">
  <meta property="og:description" content="Achte pyès machin bon kalite pou tout mak nan Redlight Autoparts.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#E10600">
  <meta name="msapplication-TileColor" content="#0A0A0A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Redlight">

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">

  <!-- Favicon & PWA Manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Redlight Autoparts</title>

  <style>
    /* Reset & Fondasyon */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Splash Screen Chajman Imedya */
    #loading-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #16181E 0%, #0A0A0A 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }

    #loading-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .logo-wrapper {
      position: relative;
      width: 88px;
      height: 88px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(225, 6, 0, 0.35);
      position: relative;
      z-index: 2;
    }

    .pulse-ring {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid #E10600;
      opacity: 0.8;
      animation: pulseAnim 2s infinite ease-out;
      box-sizing: border-box;
    }

    @keyframes pulseAnim {
      0% {
        transform: scale(0.85);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.3;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    .splash-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2.5px;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: #9CA3AF;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* Glowing Progress Bar */
    .progress-bar-container {
      width: 170px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 45%;
      background: #E10600;
      box-shadow: 0 0 10px #E10600;
      border-radius: 999px;
      animation: progressAnim 1.4s infinite ease-in-out;
    }

    @keyframes progressAnim {
      0% {
        left: -45%;
      }
      100% {
        left: 100%;
      }
    }

    /* PWA Install Banner sou mobil web */
    .pwa-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 460px;
      background: rgba(20, 22, 28, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      z-index: 99998;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-sizing: border-box;
      animation: bannerSlideUp 0.35s ease-out;
    }

    @keyframes bannerSlideUp {
      from {
        opacity: 0;
        transform: translate(-50%, 20px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    .pwa-banner-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .pwa-banner-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .pwa-banner-text {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .pwa-banner-title {
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pwa-banner-desc {
      font-size: 11px;
      color: #9CA3AF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pwa-banner-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pwa-install-btn {
      background: #E10600;
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .pwa-install-btn:active {
      transform: scale(0.96);
    }

    .pwa-close-btn {
      background: transparent;
      border: none;
      color: #9CA3AF;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Instant Native Splash Screen -->
  <div id="loading-splash">
    <div class="splash-content">
      <div class="logo-wrapper">
        <img src="icons/Icon-192.png" alt="Redlight Logo" class="splash-logo" />
        <div class="pulse-ring"></div>
      </div>
      <div class="splash-title">REDLIGHT AUTOPARTS</div>
      <div class="splash-subtitle">Pyès Machin & Pèfòmans</div>
      <div class="progress-bar-container">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- PWA Install Banner sou mobil -->
  <div id="pwa-install-banner" class="pwa-banner" style="display: none;">
    <div class="pwa-banner-left">
      <img src="icons/Icon-192.png" class="pwa-banner-icon" alt="Redlight App" />
      <div class="pwa-banner-text">
        <span class="pwa-banner-title">Redlight Autoparts</span>
        <span class="pwa-banner-desc" id="pwa-banner-desc-text">Enstale app la sou telefòn ou</span>
      </div>
    </div>
    <div class="pwa-banner-actions">
      <button id="pwa-install-btn" class="pwa-install-btn">Enstale</button>
      <button id="pwa-close-btn" class="pwa-close-btn" aria-label="Fèmen">&times;</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Retire splash screen lè Flutter fin chaje
    // -------------------------------------------------------------
    function hideSplashScreen() {
      const splash = document.getElementById('loading-splash');
      if (splash && !splash.classList.contains('fade-out')) {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 450);
      }
    }

    // Obsève aparisyon Flutter Canvas / View
    const observer = new MutationObserver(() => {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
        setTimeout(hideSplashScreen, 300);
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Sekirite: retire splash screen apre 6 segond maksimòm
    setTimeout(hideSplashScreen, 6000);

    // -------------------------------------------------------------
    // PWA Install Prompt Handler (Android & iOS)
    // -------------------------------------------------------------
    let deferredPrompt = null;
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    if (!isStandalone) {
      const dismissed = sessionStorage.getItem('pwa_prompt_dismissed');

      // Android Chrome / Edge
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;

        if (!dismissed) {
          setTimeout(() => {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.style.display = 'flex';
          }, 2000);
        }
      });

      // iOS Safari (pa gen beforeinstallprompt, montre banyè èd pou ajoute sou ekran)
      if (isIOS && !dismissed) {
        setTimeout(() => {
          const banner = document.getElementById('pwa-install-banner');
          const desc = document.getElementById('pwa-banner-desc-text');
          const btn = document.getElementById('pwa-install-btn');
          if (banner && desc && btn) {
            desc.textContent = "Peze Pataje ⎋ epi 'Ajoute sou ekran akèy'";
            btn.textContent = "Kijan?";
            btn.onclick = () => {
              alert("Pou enstale Redlight sou iPhone ou:\n\n1. Peze bouton Pataje (Share) ⎋ ki anba Safari a.\n2. Desann epi chwazi 'Ajoute sou ekran akèy' (Add to Home Screen) ➕.\n3. Peze 'Ajoute'. App la ap parèt ak logo li sou ekran telefòn ou!");
            };
            banner.style.display = 'flex';
          }
        }, 3000);
      }

      // Bouton Enstale Android
      const installBtn = document.getElementById('pwa-install-btn');
      if (installBtn && !isIOS) {
        installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            deferredPrompt = null;
            if (outcome === 'accepted') {
              const banner = document.getElementById('pwa-install-banner');
              if (banner) banner.style.display = 'none';
            }
          }
        });
      }

      // Bouton Fèmen
      const closeBtn = document.getElementById('pwa-close-btn');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          const banner = document.getElementById('pwa-install-banner');
          if (banner) banner.style.display = 'none';
          sessionStorage.setItem('pwa_prompt_dismissed', 'true');
        });
      }

      // Lè enstalasyon an reyisi
      window.addEventListener('appinstalled', () => {
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'none';
        deferredPrompt = null;
      });
    }
  </script>

  <!-- Flutter Loader Bootstrap -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
